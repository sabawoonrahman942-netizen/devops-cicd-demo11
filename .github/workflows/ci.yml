name: Rahman CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository indiriliyor
        uses: actions/checkout@v4

      - name: Dosyalar listeleniyor
        run: ls -la

      - name: index.html çıktısı gösteriliyor
        run: cat index.html

      - name: Workflow tamamlandı
        run: echo "CI Pipeline başarıyla çalıştı."
